data:
  sites: 
    - brechin
    - fcn
    - fcs
    - fsc
    - pp
  neg_csvs: 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_tankeeah_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_bear_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_kitwanga_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_chignik_2024.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_copper_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_kitkiata_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_klukshu_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_koeye_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_redoubt_2025.csv 
    data/01_raw/sv_water_conditions/SV_conditions_tracking_tenas_2025.csv
  neg: --include-negatives
  neg_ratio: 0.10
  neg_per_vid: 70
  # Human-reviewed Label Studio tasks; add sites here as annotation coverage is verified.
  neg_annotated_sites: brechin fcn fcs fsc pp
  neg_annotated_per_vid: 40
  # Exclude neighboring frames around annotated fish to reduce borderline negatives.
  neg_exclusion_frames: 3
  bucket: prod-salmonvision-edge-assets-labelstudio-source
config:
  dataset: data/04_dataset
  yolo_workdir: data/04_dataset/salmon_dataset/yolo_workdir
  real_yolo_workdir: /mnt/harukassd4tb/masamim/salmon-computer-vision/training/object-detection/data/04_dataset/salmon_dataset/yolo_workdir
  eval_workdir: /mnt/harukassd4tb/masamim/salmon-computer-vision/training/object-detection/data/04_dataset/salmon_dataset/site_eval_workdir
  ray_tmp: /mnt/harukassd4tb/masamim
split:
  # Keep complete-video holdouts even for sites with only 1-2 recording days.
  # If fewer than 5 total distinct videos exist, relax both minima to 1;
  # fewer than 3 videos causes a clear error instead of empty holdouts.
  min_val_videos: 2
  min_test_videos: 2
pack:
  download_workers: 8
preprocess:
  crop_top_half_sites: klukshu
  crop_min_visible_frac: 0.05
tune:
  device: 0
  gpu_per_trial: 1 # Lower numbers creates more parallel trials (Can be fractional)
  batch: 32
  iterations: 20
  model: yolov8n.pt
train:
  device: 1
  batch: 64
  patience: 50
  tune_dir: tune15
  model: yolov8n.pt
  run_name: 2026-10-08_tuned_full_run_stephenssmolt
exp:
  train_sites: brechin fcn fcs fsc pp
  val_sites: brechin fcn fcs fsc pp
  test_sites: brechin fcn fcs fsc pp
eval:
  imgsz: 640
  batch: 32
  device: 1
  workers: 8
runtime:
  cuda: cu124
tracking_eval:
  tracker: botsort.yaml
  coord_mode: percent
  mot_benchmark: SalmonVision
  conf: 0.05
  iou: 0.5
  imgsz: 640
  device: 1
  metric_annotation_scope: verified  # Label Studio tasks are human-reviewed; see annotation_coverage.csv
  max_videos: 0   # 0 means all

count_eval:
  tracking_thresh: 10
  vote_method: all
  drop_bounding_boxes: false
  bound_line_ratio: 0.5
