services:
  h264-batch:
    image: ${SALMONMD_IMAGE:?Set SALMONMD_IMAGE to your Raspberry Pi salmonmd image}
    init: true
    shm_size: "512mb"
    restart: "no"
    working_dir: /tools
    stop_grace_period: 30s
    environment:
      PYTHONUNBUFFERED: "1"
      H264_BATCH_FLAGS: "${FLAGS:-}"
      PYTHONPATH: /tools/training/pysalmcount
    volumes:
      - type: bind
        source: ${SALMON_REPO:?Set SALMON_REPO to the absolute checkout path on the Pi}
        target: /tools
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${H264_INPUT_ROOT:?Set H264_INPUT_ROOT to the archive root on the Pi}
        target: /archive
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DRIVE:?Set DRIVE}/${ORGID:?Set ORGID}/${SITE_NAME:?Set SITE_NAME}/${DEVICE_ID:?Set DEVICE_ID}
        target: /output
        bind:
          create_host_path: false
    entrypoint: ["/opt/salmon-venv/bin/python", "training/tools/batch_motion_h264.py"]
    command:
      - /archive
      - /output
      - --source-fps
      - ${SOURCE_FPS:?Set SOURCE_FPS to the original recording FPS}
      - --device-id
      - ${ORGID:?Set ORGID}-${SITE_NAME:?Set SITE_NAME}-${DEVICE_ID:?Set DEVICE_ID}
      - --encoder
      - cpu-h264
      - --sync-layout
      - --frame-width
      - "${FRAME_WIDTH:-704}"
      - --frame-height
      - "${FRAME_HEIGHT:-480}"
